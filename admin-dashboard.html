<!DOCTYPE html>
<html lang="pt-br">

<head>

    <title>Dashboard - ONG</title>

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/layout.css">

</head>

<body>

        <div class="dashboard-card">

            <p class="dashboard-number">8</p>
        </div>

    </div>

</html>
